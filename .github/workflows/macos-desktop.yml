name: PdfCraft desktop for Apple Silicon

on:
  push:
    branches: [desktop/macos-tauri, main]
    paths:
      - '.github/workflows/macos-desktop.yml'
      - 'packaging/macos-tauri/**'
      - 'packaging/macos/Credits.rtf'
      - 'packaging/macos/Info.plist.in'
      - 'packaging/env.sh'
      - 'apps/pdfcraft/**'
      - 'crates/**'
      - 'assets/**'
      - 'vendor/**'
      - 'Cargo.*'
      - 'craft-i18n.rev'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '3'
      # Retain release optimization without loading the whole native editor into one link-time unit.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CRAFT_I18N_REQUIRED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Rust and pinned editor resources
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.96.0 --profile minimal
          echo 'RUSTUP_TOOLCHAIN=1.96.0' >> "$GITHUB_ENV"
          for dependency in craft-i18n craft-fonts; do
            case "$dependency" in
              craft-i18n) revision="$(cat craft-i18n.rev)" ;;
              craft-fonts) revision=b076417b5880bd4154bd22f00695b1d28c6bea83 ;;
            esac
            checkout="$RUNNER_TEMP/$dependency"
            git init --quiet "$checkout"
            git -C "$checkout" fetch --depth=1 "https://github.com/storytold/$dependency.git" "$revision"
            git -C "$checkout" checkout --detach FETCH_HEAD
          done
          echo "CRAFT_FONTS_DIR=$RUNNER_TEMP/craft-fonts" >> "$GITHUB_ENV"
          echo "CRAFT_I18N_DIR=$RUNNER_TEMP/craft-i18n" >> "$GITHUB_ENV"
      - name: Test the launcher
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/macos-tauri-launcher
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo test --locked --release --manifest-path packaging/macos-tauri/Cargo.toml
      - name: Build the app and disk image
        run: bash packaging/macos-tauri/package.sh
      - name: Upload the disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/release/pdfcraft-*-macos-arm64.dmg
          archive: false
          if-no-files-found: error
      - name: Upload the app bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/release/pdfcraft-*-macos-arm64.app.zip
          archive: false
          if-no-files-found: error
