[package]
name = "pdfcraft-launcher"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Keep Tauri's event loop and dependency graph out of the editor and web builds.
[workspace]

[dependencies]
rfd = { version = "0.17", default-features = false }
tauri = { version = "2.12.5", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-build = "2.7.4"

[lints.rust]
unsafe_code = "forbid"
